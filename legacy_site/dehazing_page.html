<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dehazing Page</title>
  <link rel="stylesheet" href="bootstrap.css">
  <link rel="stylesheet" href="dehaze.css">
</head>
<body>
  <nav class="navbar bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">DehazeX</a>
      <ul class="navbar-nav">
        <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
        <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
      </ul>
    </div>
  </nav>

  <main class="container main">
    <section class="upload">
      <h2>Upload Your Satellite Image</h2>
      <input id="fileUpload" type="file" accept="image/*">
      <button id="submitBtn" class="btn primary" disabled>Upload & Process</button>
      <p id="message"></p>
    </section>

    <section class="result" id="result">
      <h3>Dehazing Result</h3>
      <div class="images">
        <div>
          <h4>Input Image</h4>
          <img id="inputImage" src="" alt="Input image">
        </div>
        <div>
          <h4>Dehazed Output</h4>
          <img id="outputImage" src="" alt="Dehazed output">
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
